<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rouchess Online</title>
    <link rel="icon" type="image/x-icon" href="Rouchess.ico">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; overflow-x: hidden; }
        
        .auth-page { display: flex; height: 100vh; justify-content: center; align-items: center; background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%); padding: 15px; }
        .auth-container { width: 100%; max-width: 400px; }
        .auth-card { background: #2c3e50; padding: 30px 20px; border-radius: 15px; border: 2px solid #3498db; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .auth-card h1 { font-size: 32px; margin-bottom: 25px; text-align: center; color: #3498db; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tab { flex: 1; padding: 10px; background: #34495e; border: none; color: white; cursor: pointer; border-radius: 6px; font-size: 14px; transition: 0.3s; }
        .auth-tab.active { background: #3498db; }
        .auth-form { display: none; } .auth-form.active { display: block; }
        .input { display: block; margin: 12px 0; padding: 12px; width: 100%; background: #34495e; border: 1px solid #7f8c8d; color: white; border-radius: 6px; font-size: 14px; }
        .input:focus { outline: none; border-color: #3498db; }
        .submit-btn { width: 100%; padding: 12px; background: #3498db; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .auth-msg { margin-top: 12px; font-size: 13px; text-align: center; }
        .error { color: #e74c3c; } .success { color: #27ae60; }
        
        .app-container { display: none; flex-direction: column; min-height: 100vh; }
        .app-container.active { display: flex; }
        .navbar { background: #2c3e50; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3498db; position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 55px; }
        .navbar h1 { color: #3498db; font-size: 22px; font-weight: bold; }
        .navbar-right { display: flex; gap: 10px; align-items: center; }
        .user-badge { background: #34495e; padding: 6px 12px; border-radius: 20px; font-size: 12px; border: 1px solid #3498db; }
        .badge { display: inline-block; padding: 2px 5px; border-radius: 4px; font-size: 10px; margin-left: 4px; color: white; font-weight: bold; text-transform: uppercase; }
        .owner { background: #e74c3c; } .verified { background: #27ae60; } .gm { background: #9b59b6; } .fm { background: #f39c12; } .im { background: #3498db; } .cm { background: #1abc9c; }
        
        button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 6px; background: #3498db; color: white; font-size: 13px; transition: 0.2s; }
        button:hover { background: #2980b9; }
        
        .container { display: flex; flex-direction: column; margin-top: 55px; width: 100%; min-height: calc(100vh - 55px); }
        .left-panel, .right-panel { padding: 12px; background: #1a1a1a; }
        .main-content { padding: 12px; display: flex; flex-direction: column; background: #1a1a1a; width: 100%; }
        
        @media (min-width: 992px) {
            .container { flex-direction: row; height: calc(100vh - 55px); overflow: hidden; }
            .left-panel { flex: 1; overflow-y: auto; border-right: 1px solid #34495e; }
            .main-content { flex: 2.5; overflow-y: auto; }
            .right-panel { flex: 1; border-left: 1px solid #34495e; display: flex; flex-direction: column; }
        }
        
        .card { background: #2c3e50; padding: 14px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #34495e; }
        .card h3 { margin-bottom: 10px; color: #3498db; font-size: 16px; }
        
        .board-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; margin: 0 auto; }
        .board-container { width: 100%; aspect-ratio: 1 / 1; position: relative; margin: 8px 0; }
        #board { width: 100% !important; height: 100% !important; border: 4px solid #ffffff; border-radius: 4px; box-shadow: 0 0 15px rgba(0,0,0,0.8); }
        
        .white-1e1d7, .square-55d63 { background-color: #ffffff !important; }
        .black-3c85d, .square-b58863 { background-color: #262626 !important; }
        
        /* VISUAL HIGHLIGHTS & TAP DOTS */
        .highlight-selected { background-color: #baca44 !important; }
        .highlight-lastmove { background-color: rgba(245, 230, 83, 0.55) !important; }
        .highlight-premove { background-color: rgba(186, 85, 211, 0.6) !important; }
        .move-dot { width: 25%; height: 25%; background-color: rgba(0, 0, 0, 0.35); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        
        .player-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; background: #2c3e50; padding: 8px 12px; border-radius: 6px; border: 1px solid #34495e; }
        .player-info { font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
        .clock { font-size: 20px; font-weight: bold; color: #f39c12; font-family: monospace; }
        
        .game-alert-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(26, 26, 26, 0.95); color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 20px; font-weight: bold; text-align: center; z-index: 999; pointer-events: none; border: 3px solid #3498db; box-shadow: 0 10px 30px rgba(0,0,0,0.6); width: 85%; }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 70% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* PAWN PROMOTION MODAL */
        .promotion-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; border-radius: 4px; }
        .promotion-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #3498db; }
        .promotion-options { display: flex; gap: 12px; }
        .promotion-btn { background: #34495e; border: 2px solid #3498db; border-radius: 8px; padding: 10px; cursor: pointer; transition: 0.2s; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; }
        .promotion-btn:hover { background: #3498db; }
        .promotion-btn img { width: 100%; height: 100%; object-fit: contain; }

        .game-info { background: #34495e; padding: 10px; border-radius: 6px; margin: 8px 0; font-size: 13px; border-left: 4px solid #3498db; text-align: center; }
        .chat-box { flex: 1; display: flex; flex-direction: column; background: #2c3e50; border-radius: 10px; border: 1px solid #34495e; overflow: hidden; height: 300px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; background: #1a252f; }
        .chat-msg { margin: 6px 0; padding: 6px; background: #34495e; border-radius: 4px; font-size: 12px; border-left: 3px solid #3498db; }
        .chat-input-area { padding: 8px; display: flex; gap: 6px; }
        
        .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tab-btn { background: #34495e; padding: 6px 12px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; color: white; font-size: 12px; }
        .tab-btn.active { background: #3498db; border-color: #3498db; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        
        .moves-list { background: #34495e; padding: 10px; border-radius: 6px; font-size: 12px; max-height: 120px; overflow-y: auto; word-wrap: break-word; line-height: 1.5; margin-top: 10px; }
        .move-item { display: inline-block; margin-right: 6px; margin-bottom: 4px; padding: 2px 6px; background: #2c3e50; border-radius: 3px; }
        .move-annotation { font-size: 10px; font-weight: bold; margin-left: 4px; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; }
        .move-annotation.brilliant { background: #1abc9c; } .move-annotation.great { background: #4a90e2; } .move-annotation.best { background: #2b733c; } .move-annotation.excellent { background: #81b64c; } .move-annotation.good { background: #a3a3a3; } .move-annotation.forced { background: #607d8b; } .move-annotation.book { background: #d5a04a; } .move-annotation.inaccuracy { background: #f5b041; } .move-annotation.mistake { background: #e67e22; } .move-annotation.blunder { background: #df4745; } 
        
        .game-setup-panel { background: #34495e; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .setup-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
        .start-match-btn { background: #27ae60 !important; font-weight: bold; font-size: 14px; width: 100%; padding: 10px; }
        
        .profile-card { background: #34495e; padding: 10px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #3498db; font-size: 13px; }
        .rating-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
        .rating-box { background: #34495e; padding: 8px; border-radius: 4px; text-align: center; }
        .rating-box .value { font-size: 16px; font-weight: bold; color: #3498db; } .rating-box .label { font-size: 11px; color: #bdc3c7; }
        .hidden { display: none !important; }
        .side-action-btn { font-size: 11px; padding: 4px 8px; }
        .friend-item { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; padding: 8px; margin-bottom: 6px; border-radius: 6px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="auth-page" id="authPage">
        <div class="auth-container">
            <div class="auth-card">
                <h1>♟ Rouchess</h1>
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchAuthTab('login', event)">Login</button>
                    <button class="auth-tab" onclick="switchAuthTab('signup', event)">Sign Up</button>
                </div>
                <form id="loginForm" class="auth-form active" onsubmit="login(event)">
                    <input class="input" id="loginUsername" placeholder="Username" required>
                    <input class="input" id="loginPassword" type="password" placeholder="Password" required>
                    <button type="submit" class="submit-btn">Login</button>
                    <p id="loginMsg" class="auth-msg"></p>
                </form>
                <form id="signupForm" class="auth-form" onsubmit="signup(event)">
                    <input class="input" id="signupUsername" placeholder="Username" required>
                    <input class="input" id="signupRealname" placeholder="Full Name" required>
                    <input class="input" id="signupPassword" type="password" placeholder="Password" required>
                    <button type="submit" class="submit-btn">Create Account</button>
                    <p id="signupMsg" class="auth-msg"></p>
                </form>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="navbar">
            <h1>♟ Rouchess</h1>
            <div class="navbar-right">
                <div class="user-badge" id="userDisplay">...</div>
                <button onclick="logout()" style="padding: 4px 8px; font-size: 12px;">Logout</button>
            </div>
        </div>

        <div class="container">
            <div class="left-panel">
                <div class="card">
                    <h3>👤 My Profile</h3>
                    <div class="profile-card" id="myProfile">Loading...</div>
                </div>
                <div class="card">
                    <h3>📊 My Stats</h3>
                    <div class="rating-info" id="statsInfo"></div>
                </div>
            </div>

            <div class="main-content">
                <div class="card">
                    <h3>♟ Play Chess</h3>
                    
                    <div class="game-setup-panel">
                        <div class="setup-row">
                            <label><strong>Mode:</strong></label>
                            <select id="gameModeSelect" class="input" style="margin:0; width:65%;" onchange="toggleSetupFields()">
                                <option value="bot">Vs Computer Bot</option>
                                <option value="local">Local 2-Player</option>
                                <option value="online">🌐 Online Multiplayer</option>
                            </select>
                        </div>
                        <div class="setup-row" id="botDifficultyWrapper">
                            <label><strong>Bot Level:</strong> [<span id="botLevelVal">10</span>]</label>
                            <input type="range" id="botLevelSlider" min="1" max="20" value="10" style="width:50%;" oninput="document.getElementById('botLevelVal').innerText=this.value">
                        </div>
                        <div class="setup-row" id="playerColorWrapper">
                            <label><strong>Play as:</strong></label>
                            <select id="playerColorSelect" class="input" style="margin:0; width:65%;">
                                <option value="w">♔ White</option>
                                <option value="b">♚ Black</option>
                                <option value="random">🎲 Random</option>
                            </select>
                        </div>
                        <div class="setup-row">
                            <label><strong>Time:</strong></label>
                            <select id="matchTimeFormat" class="input" style="margin:0; width:65%;" onchange="toggleTimeFields()">
                                <option value="blitz" selected>⚡ Blitz (5+3)</option>
                                <option value="rapid">🔥 Rapid (10+5)</option>
                                <option value="custom">⚙️ Custom</option>
                            </select>
                        </div>
                        <div class="setup-row hidden" id="customTimeWrapper">
                            <label><strong>Set Time:</strong></label>
                            <div style="display:flex; width: 65%; gap: 5px;">
                                <input type="number" id="customMins" class="input" placeholder="Min" style="margin:0; width:50%;" value="15">
                                <input type="number" id="customInc" class="input" placeholder="Inc(s)" style="margin:0; width:50%;" value="10">
                            </div>
                        </div>
                        <button class="start-match-btn" id="mainPlayBtn" onclick="triggerPlayConfiguration()">▶️ Start Game</button>
                    </div>

                    <div class="game-info" id="gameStatus">Select setup and press Start</div>
                    
                    <div class="board-wrapper">
                        <!-- TOP PLAYER -->
                        <div class="player-bar">
                            <div class="player-info" id="topPlayer">Black: Opponent</div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <div id="topSideBtns" class="hidden">
                                    <button onclick="resignAs()" class="side-action-btn" style="background:#e74c3c;">Resign</button>
                                </div>
                                <div class="clock" id="topClock">5:00</div>
                            </div>
                        </div>

                        <div class="board-container">
                            <div id="board"></div>

                            <!-- PROMOTION MODAL OVERLAY -->
                            <div id="promotionOverlay" class="promotion-overlay hidden">
                                <div class="promotion-title">Promote Pawn To:</div>
                                <div class="promotion-options">
                                    <button class="promotion-btn" onclick="selectPromotionPiece('q')"><img id="promQ" src="" alt="Queen"></button>
                                    <button class="promotion-btn" onclick="selectPromotionPiece('r')"><img id="promR" src="" alt="Rook"></button>
                                    <button class="promotion-btn" onclick="selectPromotionPiece('b')"><img id="promB" src="" alt="Bishop"></button>
                                    <button class="promotion-btn" onclick="selectPromotionPiece('n')"><img id="promN" src="" alt="Knight"></button>
                                </div>
                            </div>
                        </div>

                        <!-- BOTTOM PLAYER -->
                        <div class="player-bar">
                            <div class="player-info" id="bottomPlayer">White: You</div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <div id="bottomSideBtns" class="hidden">
                                    <button onclick="resignAs()" class="side-action-btn" style="background:#e74c3c;">Resign</button>
                                    <button onclick="offerDrawAs()" class="side-action-btn" style="background:#f39c12;">Draw</button>
                                </div>
                                <div class="clock" id="bottomClock">5:00</div>
                            </div>
                        </div>
                    </div>

                    <div class="moves-list" id="movesList">Game not started</div>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('chat', event)">💬 Chat</button>
                    <button class="tab-btn" onclick="switchTab('social', event)">👥 Social</button>
                    <button class="tab-btn hidden" id="adminTabBtn" onclick="switchTab('admin', event)">⚙️ Admin</button>
                </div>

                <div class="tab-content active" id="chat-tab">
                    <div class="chat-box">
                        <div class="chat-messages" id="chatMessages">Loading chat...</div>
                        <div class="chat-input-area">
                            <input class="input" id="chatInput" placeholder="Message..." style="margin: 0;">
                            <button onclick="sendMessage()" style="padding: 8px 12px;">Send</button>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="social-tab">
                    <div class="card">
                        <h3>🔍 Search Users</h3>
                        <div style="display:flex; gap:5px;">
                            <input class="input" id="searchUserInput" placeholder="Username" style="margin:0;">
                            <button onclick="searchProfile()">Search</button>
                        </div>
                        <div id="searchResultArea" style="margin-top: 8px;"></div>
                    </div>
                    <div class="card">
                        <h3>🤝 My Friends</h3>
                        <div id="friendsListArea">No friends yet.</div>
                    </div>
                </div>

                <div class="tab-content" id="admin-tab">
                    <div class="card">
                        <h3>⚙️ Badges</h3>
                        <input class="input" id="verifyUsername" placeholder="Target username">
                        <select class="input" id="badgeSelect">
                            <option value="">Select Badge</option>
                            <option value="verified">✓ Verified</option>
                            <option value="gm">♛ GM</option>
                            <option value="fm">♖ FM</option>
                            <option value="im">♗ IM</option>
                            <option value="cm">♘ CM</option>
                        </select>
                        <button onclick="giveBadge()" style="width: 100%; margin-bottom: 6px;">Give Badge</button>
                        <button onclick="takeBadge()" style="width: 100%; background: #e67e22;">Take Badge</button>
                    </div>
                    <div class="card">
                        <h3>🚫 Moderation</h3>
                        <input class="input" id="modUsername" placeholder="Target username">
                        <input class="input" id="banReason" placeholder="Reason">
                        <button onclick="adminBanPlayer()" style="width: 100%; background: #e74c3c; margin-bottom: 6px;">Ban User</button>
                        <button onclick="adminUnbanPlayer()" style="width: 100%; background: #27ae60;">Unban User</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>

    <script>
        /* =======================================
           1. FIREBASE CONFIGURATION 
           ======================================= */
        const firebaseConfig = {
            apiKey: "AIzaSyASwi2xYvco3VyzenmR6n_y3eIM-qVL6EY",
            authDomain: "rouchess.firebaseapp.com",
            databaseURL: "https://rouchess-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rouchess",
            storageBucket: "rouchess.firebasestorage.app",
            messagingSenderId: "494911482040",
            appId: "1:494911482040:web:e1a60a3338b18c5532ec4d",
            measurementId: "G-MXCKTLN848"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        /* =======================================
           2. BASE VARIABLES
           ======================================= */
        let users = {}; 
        let currentUser = localStorage.getItem('currentUser');
        let game = new Chess();
        let board = null;
        let gameActive = false;
        let whiteTime = 300, blackTime = 300, increment = 3, gameTimer = null;
        let isWhiteTurn = true;
        let selectedPiece = null;
        
        let gameMode = 'bot';
        let playerColor = 'w';
        let isOnlineGame = false;
        let onlineRoomId = null;
        let onlineRef = null;
        
        let moveEvaluations = [];
        let lastMove = null;
        let premove = null;
        let pendingPromotionMove = null;

        // Auto-seed default testing account
        db.ref('users/Rounakgod_65').once('value').then(s => {
            if(!s.exists()) {
                db.ref('users/Rounakgod_65').set({ password: 'Jiko@123', realname: 'Rounak Bera', badges: ['owner'], blitzRating: 2800, rapidRating: 2750, classicalRating: 2700, wins: 3200, losses: 1800, banned: false, banReason: '' });
            }
        });

        function initApp() {
            if (!currentUser) {
                document.getElementById('authPage').style.display = 'flex';
                document.getElementById('appContainer').classList.remove('active');
            } else {
                document.getElementById('authPage').style.display = 'none';
                document.getElementById('appContainer').classList.add('active');
                
                db.ref('users').on('value', snap => {
                    users = snap.val() || {};
                    if (currentUser && users[currentUser] && users[currentUser].banned) {
                        alert(`You have been banned!\nReason: ${users[currentUser].banReason || 'Administrative Action'}`);
                        logout(); return;
                    }
                    updateUI(); displayProfile(); displayStats(); renderFriends();
                });

                listenToChat(); listenForPings(); toggleSetupFields();
                initializeBoard('white');
            }
        }

        /* =======================================
           3. STRICT TAP-TO-MOVE ENGINE (NO DRAG)
           ======================================= */
        function initializeBoard(orientation) { 
            if(board) board.destroy(); 
            
            const config = {
                position: 'start',
                orientation: orientation,
                draggable: false, // DRAG AND DROP DISABLED EXPLICITLY
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            
            board = ChessBoard('board', config); 
            $(window).resize(() => board.resize());

            // Listen directly for clean taps on squares
            $('#board').off('click pointerdown', '.square-55d63, .square-b58863')
                       .on('click pointerdown', '.square-55d63, .square-b58863', function(e) {
                if (e.type === 'pointerdown' && e.pointerType === 'mouse') return;
                const square = $(this).attr('data-square');
                if (square) {
                    e.preventDefault();
                    handleSquareTap(square);
                }
            });
        }

        function isMyTurn() {
            if (!gameActive) return false;
            if (gameMode === 'local') return true;
            return (isWhiteTurn && playerColor === 'w') || (!isWhiteTurn && playerColor === 'b');
        }

        /* HARDENED TAP ENGINE */
        function handleSquareTap(square) {
            if (!gameActive || pendingPromotionMove) return;

            // 1. PREMOVE TAP LOGIC (Opponent's turn)
            if (!isMyTurn()) {
                if (selectedPiece === null) {
                    const piece = game.get(square);
                    if (piece && piece.color === playerColor) {
                        selectedPiece = square;
                        highlightSquare(square, '#baca44');
                    }
                } else {
                    if (square === selectedPiece) {
                        clearHighlights();
                        premove = null;
                    } else {
                        premove = { from: selectedPiece, to: square };
                        highlightPremove(selectedPiece, square);
                        selectedPiece = null;
                    }
                }
                return;
            }

            // 2. REGULAR TURN TAP LOGIC
            if (selectedPiece === null) {
                const piece = game.get(square);
                if (piece && piece.color === (isWhiteTurn ? 'w' : 'b')) {
                    selectedPiece = square;
                    clearHighlights();
                    highlightSquare(square, '#baca44');
                    showLegalMoves(square);
                }
            } else {
                if (square === selectedPiece) { 
                    clearHighlights(); 
                    return; 
                }

                const piece = game.get(square);
                if (piece && piece.color === (isWhiteTurn ? 'w' : 'b')) {
                    clearHighlights(); 
                    selectedPiece = square;
                    highlightSquare(square, '#baca44'); 
                    showLegalMoves(square);
                    return;
                }

                // Check for Pawn Promotion Eligibility
                const movingPiece = game.get(selectedPiece);
                const isPawn = movingPiece && movingPiece.type === 'p';
                const targetRank = square.charAt(1);
                const isPromoting = isPawn && ((movingPiece.color === 'w' && targetRank === '8') || (movingPiece.color === 'b' && targetRank === '1'));

                if (isPromoting) {
                    // Check if move is legal before opening modal
                    const testMoves = game.moves({ square: selectedPiece, verbose: true });
                    const isLegal = testMoves.some(m => m.to === square);
                    if (isLegal) {
                        pendingPromotionMove = { from: selectedPiece, to: square };
                        showPromotionOverlay(movingPiece.color);
                        return;
                    }
                }

                // Execute Standard Move
                const move = game.move({ from: selectedPiece, to: square, promotion: 'q' });
                if (move === null) { 
                    clearHighlights(); 
                    return; 
                }
                
                lastMove = { from: selectedPiece, to: square };
                selectedPiece = null;
                clearHighlights();
                finishMoveLogic(move);
            }
        }

        /* PROMOTION SELECTION MODAL LOGIC */
        function showPromotionOverlay(color) {
            const baseUrl = 'https://chessboardjs.com/img/chesspieces/wikipedia/';
            document.getElementById('promQ').src = `${baseUrl}${color}Q.png`;
            document.getElementById('promR').src = `${baseUrl}${color}R.png`;
            document.getElementById('promB').src = `${baseUrl}${color}B.png`;
            document.getElementById('promN').src = `${baseUrl}${color}N.png`;
            document.getElementById('promotionOverlay').classList.remove('hidden');
        }

        function selectPromotionPiece(pieceType) {
            if (!pendingPromotionMove) return;
            
            const move = game.move({
                from: pendingPromotionMove.from,
                to: pendingPromotionMove.to,
                promotion: pieceType
            });

            document.getElementById('promotionOverlay').classList.add('hidden');
            lastMove = { from: pendingPromotionMove.from, to: pendingPromotionMove.to };
            pendingPromotionMove = null;
            selectedPiece = null;
            clearHighlights();

            if (move !== null) {
                finishMoveLogic(move);
            }
        }

        function executePremove() {
            if (!premove || !isMyTurn()) return;

            // Check if premove triggers promotion
            const movingPiece = game.get(premove.from);
            const isPawn = movingPiece && movingPiece.type === 'p';
            const targetRank = premove.to.charAt(1);
            const isPromoting = isPawn && ((movingPiece.color === 'w' && targetRank === '8') || (movingPiece.color === 'b' && targetRank === '1'));

            let promotionPiece = 'q';
            if (isPromoting) {
                pendingPromotionMove = { from: premove.from, to: premove.to };
                premove = null;
                showPromotionOverlay(movingPiece.color);
                return;
            }

            const move = game.move({ from: premove.from, to: premove.to, promotion: promotionPiece });
            const pm = premove;
            premove = null;
            clearHighlights();

            if (move !== null) {
                lastMove = { from: pm.from, to: pm.to };
                finishMoveLogic(move);
            }
        }

        /* =======================================
           4. VISUAL HIGHLIGHTS
           ======================================= */
        function highlightSquare(s, c) { 
            const el = document.querySelector(`#board .square-${s}`);
            if(el) el.style.backgroundColor = c; 
        }

        function highlightLastMove() {
            if (!lastMove) return;
            $(`#board .square-${lastMove.from}`).addClass('highlight-lastmove');
            $(`#board .square-${lastMove.to}`).addClass('highlight-lastmove');
        }

        function highlightPremove(from, to) {
            $('.square-55d63, .square-b58863').removeClass('highlight-premove');
            $(`#board .square-${from}`).addClass('highlight-premove');
            $(`#board .square-${to}`).addClass('highlight-premove');
        }

        function showLegalMoves(square) {
            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(m => {
                const destSquareEl = document.querySelector(`#board .square-${m.to}`);
                if (destSquareEl) {
                    destSquareEl.style.position = 'relative';
                    const dot = document.createElement('div');
                    dot.className = 'move-dot';
                    destSquareEl.appendChild(dot);
                }
            });
        }

        function clearHighlights() { 
            document.querySelectorAll('.move-dot').forEach(d => d.remove());
            $('.square-55d63, .square-b58863').removeClass('highlight-lastmove highlight-premove').css('background-color', '');
            if (selectedPiece) {
                highlightSquare(selectedPiece, '#baca44');
            }
            highlightLastMove();
        } 

        /* =======================================
           5. GAME CONTROL & ENGINE LOGIC
           ======================================= */
        function triggerPlayConfiguration() {
            isOnlineGame = false;
            playerColor = document.getElementById('playerColorSelect').value === 'random' ? (Math.random()>0.5?'w':'b') : document.getElementById('playerColorSelect').value;
            if(gameMode === 'local') playerColor = 'w';
            
            const timeSettings = getMatchTimeSettings();
            whiteTime = timeSettings.base; blackTime = timeSettings.base; increment = timeSettings.inc;
            startGameInternal(playerColor);
        }

        function startGameInternal(orientation) {
            gameActive = true; game = new Chess();
            moveEvaluations = []; lastMove = null; premove = null; selectedPiece = null; pendingPromotionMove = null;
            document.getElementById('promotionOverlay').classList.add('hidden');
            initializeBoard(orientation === 'b' ? 'black' : 'white');
            isWhiteTurn = true;
            clearHighlights(); updateButtonVisibility();
            
            if(!isOnlineGame) {
                let topName = playerColor === 'w' ? 'Bot' : currentUser;
                let botName = playerColor === 'w' ? currentUser : 'Bot';
                if(gameMode === 'local') { topName = 'Player 2'; botName = 'Player 1'; }
                
                document.getElementById('topPlayer').textContent = `Black: ${topName}`;
                document.getElementById('bottomPlayer').textContent = `White: ${botName}`;
                updateGameStatus();
            }
            
            startClock();
            if (gameMode === 'bot' && playerColor === 'b') setTimeout(makeBotMove, 800);
        }

        function finishMoveLogic(move) {
            calculateEngineFeedback(move);

            if (isWhiteTurn) whiteTime += increment; else blackTime += increment;
            isWhiteTurn = !isWhiteTurn;
            
            board.position(game.fen());
            clearHighlights();
            updateMovesList();
            updateGameStatus();

            if (isOnlineGame) {
                db.ref('rooms/' + onlineRoomId).update({
                    fen: game.fen(), whiteTime: whiteTime, blackTime: blackTime,
                    lastMoveFrom: currentUser, lastMoveData: move
                });
            }

            if (game.game_over()) endGame();
            else {
                if (game.in_check()) showGameAlert('💥 CHECK!', 'check');
                
                if (isMyTurn()) {
                    executePremove();
                } else if (gameMode === 'bot') {
                    setTimeout(makeBotMove, 600);
                }
            }
        }

        function makeBotMove() {
            if (!gameActive) return;
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;
            const selectedMove = moves[Math.floor(Math.random() * moves.length)];
            game.move(selectedMove.san);
            lastMove = { from: selectedMove.from, to: selectedMove.to };
            finishMoveLogic(selectedMove);
        }

        /* =======================================
           6. ONLINE MATCHMAKING & FIREBASE SYNC
           ======================================= */
        function findOnlineMatch() {
            const timeSettings = getMatchTimeSettings();
            whiteTime = timeSettings.base; blackTime = timeSettings.base; increment = timeSettings.inc;
            document.getElementById('gameStatus').innerText = "Connecting to Matchmaking...";
            isOnlineGame = true;
            
            db.ref('rooms').orderByChild('status').equalTo('waiting').once('value').then(snapshot => {
                const rooms = snapshot.val();
                if (rooms) {
                    const roomId = Object.keys(rooms)[0]; 
                    if (rooms[roomId].whitePlayer === currentUser) {
                        document.getElementById('gameStatus').innerText = "Already in queue..."; return;
                    }
                    onlineRoomId = roomId; playerColor = 'b';
                    db.ref('rooms/' + roomId).update({ blackPlayer: currentUser, status: 'playing' });
                    listenToOnlineRoom(); startGameInternal('b');
                } else {
                    onlineRoomId = db.ref('rooms').push().key; playerColor = 'w';
                    db.ref('rooms/' + onlineRoomId).set({
                        fen: game.fen(), whitePlayer: currentUser, blackPlayer: null,
                        status: 'waiting', whiteTime: whiteTime, blackTime: blackTime,
                        lastMoveTime: firebase.database.ServerValue.TIMESTAMP
                    });
                    listenToOnlineRoom(); startGameInternal('w');
                    document.getElementById('gameStatus').innerText = "Waiting for an opponent...";
                }
            });
        }

        function listenToOnlineRoom() {
            if (onlineRef) onlineRef.off();
            onlineRef = db.ref('rooms/' + onlineRoomId);
            
            onlineRef.on('value', snapshot => {
                const data = snapshot.val(); if (!data) return;

                if (gameActive && data.forcedWinner) endGame(data.forcedWinner, data.reason);

                if (data.status === 'playing') {
                    let isWhiteSelf = playerColor === 'w';
                    document.getElementById('bottomPlayer').textContent = isWhiteSelf ? `White: ${data.whitePlayer}` : `Black: ${data.blackPlayer}`;
                    document.getElementById('topPlayer').textContent = isWhiteSelf ? `Black: ${data.blackPlayer || 'Waiting...'}` : `White: ${data.whitePlayer}`;
                    updateGameStatus();
                }

                if (data.fen !== game.fen() && data.lastMoveFrom !== currentUser && !data.forcedWinner && data.lastMoveData) {
                    game.move(data.lastMoveData.san);
                    lastMove = { from: data.lastMoveData.from, to: data.lastMoveData.to };
                    board.position(game.fen());
                    isWhiteTurn = game.turn() === 'w';
                    whiteTime = data.whiteTime; blackTime = data.blackTime;
                    
                    clearHighlights();
                    calculateEngineFeedback(data.lastMoveData); 
                    updateMovesList();
                    
                    if(game.in_check()) showGameAlert('💥 CHECK!', 'check');
                    if(game.game_over()) endGame();
                    else {
                        updateGameStatus();
                        executePremove();
                    }
                }
            });
        }

        /* =======================================
           7. MOVE EVALUATIONS, CLOCKS & RATINGS
           ======================================= */
        function calculateEngineFeedback(move) {
            if(!move) return;
            let label = "Excellent", cssClass = "excellent";
            
            if (game.history().length <= 6) { moveEvaluations.push({ label: "Book", class: "book" }); return; }
            if (move.san.includes('#')) { moveEvaluations.push({ label: "Brilliant", class: "brilliant" }); return; }

            const pieceValues = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
            let valueCaptured = move.captured ? pieceValues[move.captured] : 0;
            let movingPieceValue = pieceValues[move.piece];

            if (valueCaptured > 0) {
                if (valueCaptured > movingPieceValue) { label = "Great"; cssClass = "great"; }
                else if (valueCaptured === movingPieceValue) { label = "Best"; cssClass = "best"; }
                else { label = "Good"; cssClass = "good"; }
            } else {
                let safeMoves = ["Best", "Excellent", "Good"];
                let hash = 0;
                for (let i = 0; i < move.san.length; i++) hash = move.san.charCodeAt(i) + ((hash << 5) - hash);
                label = safeMoves[Math.abs(hash) % safeMoves.length];
                cssClass = label.toLowerCase();
            }
            moveEvaluations.push({ label: label, class: cssClass });
        }

        function startClock() {
            if (gameTimer) clearInterval(gameTimer);
            updateClocks();
            gameTimer = setInterval(() => {
                if (!gameActive) return;
                if (isWhiteTurn) whiteTime = Math.max(0, whiteTime - 1);
                else blackTime = Math.max(0, blackTime - 1);
                updateClocks();
                if (whiteTime <= 0 || blackTime <= 0) endGame();
            }, 1000);
        }

        function updateClocks() {
            const f = s => `${Math.floor(s/60)}:${s%60<10?'0':''}${s%60}`;
            if (playerColor === 'w') {
                document.getElementById('bottomClock').textContent = f(whiteTime);
                document.getElementById('topClock').textContent = f(blackTime);
            } else {
                document.getElementById('bottomClock').textContent = f(blackTime);
                document.getElementById('topClock').textContent = f(whiteTime);
            }
        }

        function endGame(forcedWinner = null, reason = null) {
            if (!gameActive) return;
            gameActive = false; 
            clearInterval(gameTimer);
            
            let resultText = 'Game Over';
            let outcome = null; 

            if (forcedWinner) {
                outcome = forcedWinner.toLowerCase();
                resultText = `${forcedWinner} won by ${reason}`;
            } else if (game.in_checkmate()) {
                outcome = (game.turn() === 'w') ? 'black' : 'white';
                resultText = `${outcome === 'white' ? 'White' : 'Black'} won by Checkmate`;
            } else if (game.in_stalemate() || game.in_draw() || game.in_threefold_repetition()) {
                outcome = 'draw';
                resultText = 'Draw';
            } else if (whiteTime <= 0) {
                outcome = 'black';
                resultText = 'Black won on time';
            } else if (blackTime <= 0) {
                outcome = 'white';
                resultText = 'White won on time';
            }

            // RATING ENGINE SYNC
            if (gameMode !== 'local' && users[currentUser]) {
                let user = users[currentUser];
                let format = document.getElementById('matchTimeFormat').value;
                let currentRating = format === 'rapid' ? (user.rapidRating || 1500) : (user.blitzRating || 1500);
                let oppRating = 1500;

                if (gameMode === 'bot') {
                    let level = parseInt(document.getElementById('botLevelSlider').value);
                    oppRating = 400 + ((level - 1) * 100);
                } else if (gameMode === 'online') {
                    let oppName = playerColor === 'w' ? document.getElementById('topPlayer').textContent.replace('Black: ', '') : document.getElementById('topPlayer').textContent.replace('White: ', '');
                    if (users[oppName]) {
                        oppRating = format === 'rapid' ? (users[oppName].rapidRating || 1500) : (users[oppName].blitzRating || 1500);
                    }
                }

                let actualScore = 0.5;
                if (outcome === (playerColor === 'w' ? 'white' : 'black')) actualScore = 1;
                else if (outcome === 'draw') actualScore = 0.5;
                else actualScore = 0;

                let expectedScore = 1 / (1 + Math.pow(10, (oppRating - currentRating) / 400));
                let kFactor = currentRating < 2100 ? 32 : (currentRating < 2400 ? 24 : 16);
                let ratingChange = Math.round(kFactor * (actualScore - expectedScore));

                if (format === 'rapid') user.rapidRating = Math.max(100, currentRating + ratingChange);
                else user.blitzRating = Math.max(100, currentRating + ratingChange);

                if (actualScore === 1) user.wins = (user.wins || 0) + 1;
                else if (actualScore === 0) user.losses = (user.losses || 0) + 1;

                db.ref('users/' + currentUser).update({
                    blitzRating: user.blitzRating || 1500,
                    rapidRating: user.rapidRating || 1500,
                    wins: user.wins || 0,
                    losses: user.losses || 0
                });

                let ratingSign = ratingChange >= 0 ? '+' : '';
                let ratingColor = ratingChange >= 0 ? '#27ae60' : '#e74c3c';
                resultText += `<br><span style="font-size: 14px; color: ${ratingColor}; display: block; margin-top: 6px;">📊 Rating: ${currentRating} (${ratingSign}${ratingChange}) ➝ ${currentRating + ratingChange}</span>`;
            }

            document.getElementById('gameStatus').innerHTML = `<strong>${resultText}</strong>`;
            showGameAlert(forcedWinner ? `${forcedWinner} Won!` : resultText.split('<br>')[0], 'draw');
            
            if (isOnlineGame && onlineRef && !forcedWinner) {
                db.ref('rooms/' + onlineRoomId).update({ status: 'finished' });
            }
        }

        /* =======================================
           8. HELPERS & UI CONTROLS
           ======================================= */
        function toggleTimeFields() {
            document.getElementById('customTimeWrapper').classList.toggle('hidden', document.getElementById('matchTimeFormat').value !== 'custom');
        }
        function getMatchTimeSettings() {
            const format = document.getElementById('matchTimeFormat').value;
            if (format === 'rapid') return { base: 600, inc: 5 };
            if (format === 'blitz') return { base: 300, inc: 3 };
            return {
                base: (parseInt(document.getElementById('customMins').value) || 10) * 60,
                inc: parseInt(document.getElementById('customInc').value) || 0
            };
        }

            gameMode = mode;
            document.getElementById('botDifficultyWrapper').style.display = mode === 'bot' ? 'flex' : 'none';
            document.getElementById('playerColorWrapper').style.display = mode === 'bot' ? 'flex' : 'none';

            if (mode === 'online') {
                playBtn.innerHTML = "🔍 Find Online Match"; playBtn.style.background = "#8e44ad"; playBtn.onclick = findOnlineMatch;
            } else {
                playBtn.innerHTML = "▶️ Start Game"; playBtn.style.background = "#27ae60"; playBtn.onclick = triggerPlayConfiguration;
            }

            document.getElementById('bottomSideBtns').classList.remove('hidden');
        }

            document.getElementById('gameStatus').textContent = gameActive ? `Active • ${isWhiteTurn ? "White" : "Black"}'s turn` : 'Game Finished'; 
        }
        function updateMovesList() {
            const history = game.history({ verbose: true });
            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                let wEval = moveEvaluations[i] || { label: "Book", class: "book" };
                let item = `<span class="move-item">${(i/2)+1}. ${history[i].san}<span class="move-annotation ${wEval.class}">${wEval.label}</span>`;
                if (history[i + 1]) {
                    let bEval = moveEvaluations[i + 1] || { label: "Book", class: "book" };
                    item += ` ${history[i + 1].san}<span class="move-annotation ${bEval.class}">${bEval.label}</span>`;
                }
                html += item + '</span>';
            }
            const ml = document.getElementById('movesList');
            ml.innerHTML = html || 'No moves yet'; ml.scrollTop = ml.scrollHeight;
        }

            document.querySelector('.board-container').appendChild(alertEl);

            if(gameActive && confirm("Are you sure you want to resign?")) {

        function listenToChat() {

                let html = '';
                snap.forEach(c => { let m = c.val(); html += `<div class="chat-msg"><strong>${m.user}</strong>: ${m.text}</div>`; });
                const cb = document.getElementById('chatMessages'); cb.innerHTML = html; cb.scrollTop = cb.scrollHeight;
            });
        }

        function giveBadge() {
            const target = document.getElementById('verifyUsername').value.trim(), badge = document.getElementById('badgeSelect').value;
            if (target && badge && users[target]) {
                let b = users[target].badges || []; if (!b.includes(badge)) b.push(badge);
                db.ref('users/' + target + '/badges').set(b);
            }
        }
        function takeBadge() {
            const target = document.getElementById('verifyUsername').value.trim(), badge = document.getElementById('badgeSelect').value;
            if (target && badge && users[target]) {
                let b = (users[target].badges || []).filter(x => x !== badge);
                db.ref('users/' + target + '/badges').set(b);
            }
        }
        function adminBanPlayer() {
            const target = document.getElementById('modUsername').value.trim(), reason = document.getElementById('banReason').value.trim();
            if (users[target]) db.ref('users/' + target).update({ banned: true, banReason: reason || 'Violation' });
        }
        function adminUnbanPlayer() {
            const target = document.getElementById('modUsername').value.trim();
            if (users[target]) db.ref('users/' + target).update({ banned: false, banReason: '' });
        }

        initApp();
    </script>
</body>
</html>
