<!DOCTYPE html>
<html>
<head>
    <title>Rouchess Online</title>
    <link rel="icon" type="image/x-icon" href="Rouchess.ico">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .auth-page {
            display: flex; height: 100vh; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
        }
        .auth-container { width: 100%; max-width: 400px; padding: 40px; }
        .auth-card {
            background: #2c3e50; padding: 40px; border-radius: 15px;
            border: 2px solid #3498db; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .auth-card h1 { font-size: 36px; margin-bottom: 30px; text-align: center; color: #3498db; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tab {
            flex: 1; padding: 10px; background: #34495e; border: none;
            color: white; cursor: pointer; border-radius: 6px; font-size: 14px; transition: 0.3s;
        }
        .auth-tab.active { background: #3498db; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .input {
            display: block; margin: 12px 0; padding: 12px; width: 100%;
            background: #34495e; border: 1px solid #7f8c8d; color: white; border-radius: 6px; font-size: 14px;
        }
        .input:focus { outline: none; border-color: #3498db; }
        .submit-btn {
            width: 100%; padding: 12px; background: #3498db; border: none; color: white;
            border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.3s;
        }
        .submit-btn:hover { background: #2980b9; }
        .auth-msg { margin-top: 12px; font-size: 13px; text-align: center; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        
        .app-container { display: none; }
        .app-container.active { display: flex; }
        .navbar {
            background: #2c3e50; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #3498db; position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 60px;
        }
        .navbar h1 { color: #3498db; font-size: 28px; font-weight: bold; }
        .navbar-right { display: flex; gap: 16px; align-items: center; }
        .user-badge { background: #34495e; padding: 8px 16px; border-radius: 20px; font-size: 14px; border: 1px solid #3498db; }
        .badge {
            display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px;
            margin-left: 4px; color: white; font-weight: bold; text-transform: uppercase;
        }
        .owner { background: #e74c3c; } .verified { background: #27ae60; }
        .gm { background: #9b59b6; } .fm { background: #f39c12; }
        .im { background: #3498db; } .cm { background: #1abc9c; }
        
        button { padding: 10px 14px; cursor: pointer; border: none; border-radius: 6px; background: #3498db; color: white; font-size: 14px; transition: 0.2s; }
        button:hover { background: #2980b9; }
        
        .container { display: flex; height: calc(100vh - 60px); margin-top: 60px; width: 100%; }
        .left-panel { flex: 1; padding: 20px; overflow-y: auto; border-right: 1px solid #34495e; background: #1a1a1a; }
        .main-content { flex: 2.5; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; background: #1a1a1a; }
        .right-panel { flex: 1; padding: 20px; border-left: 1px solid #34495e; display: flex; flex-direction: column; background: #1a1a1a; }
        
        .card { background: #2c3e50; padding: 16px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #34495e; }
        .card h3 { margin-bottom: 12px; color: #3498db; }
        
        .board-container { display: flex; justify-content: center; margin: 20px 0; position: relative; }
        #board { width: 500px; height: 500px; border: 6px solid #ffffff; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .white-1e1d7, .square-55d63 { background-color: #ffffff !important; }
        .black-3c85d, .square-b58863 { background-color: #262626 !important; }
        
        .move-dot {
            width: 25%; height: 25%; background-color: rgba(0, 0, 0, 0.25); border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }

        .game-alert-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(26, 26, 26, 0.95); color: #fff; padding: 15px 30px; border-radius: 10px;
            font-size: 28px; font-weight: bold; text-align: center; z-index: 999; pointer-events: none;
            border: 3px solid #3498db; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .game-info { background: #34495e; padding: 16px; border-radius: 6px; margin: 10px 0; font-size: 14px; border-left: 4px solid #3498db; }
        .chat-box { flex: 1; display: flex; flex-direction: column; background: #2c3e50; border-radius: 10px; border: 1px solid #34495e; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: #1a252f; }
        .chat-msg { margin: 8px 0; padding: 8px; background: #34495e; border-radius: 4px; font-size: 13px; border-left: 3px solid #3498db; }
        .chat-input-area { padding: 12px; display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab-btn { background: #34495e; padding: 8px 16px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; color: white; font-size: 13px; }
        .tab-btn.active { background: #3498db; border-color: #3498db; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .moves-list { background: #34495e; padding: 12px; border-radius: 6px; font-size: 13px; max-height: 180px; overflow-y: auto; word-wrap: break-word; line-height: 1.5; }
        .move-item { display: inline-block; margin-right: 8px; margin-bottom: 6px; padding: 4px 8px; background: #2c3e50; border-radius: 3px; font-size: 12px; }
        
        /* Chess.com Label Theme System */
        .move-annotation { font-size: 11px; font-weight: bold; margin-left: 5px; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; }
        .move-annotation.brilliant { background: #1abc9c; color: #fff; } 
        .move-annotation.great { background: #4a90e2; color: #fff; } 
        .move-annotation.best { background: #2b733c; color: #fff; } 
        .move-annotation.excellent { background: #81b64c; color: #fff; } 
        .move-annotation.good { background: #a3a3a3; color: #fff; }
        .move-annotation.forced { background: #607d8b; color: #fff; }
        .move-annotation.book { background: #d5a04a; color: #fff; }
        .move-annotation.inaccuracy { background: #f5b041; color: #fff; } 
        .move-annotation.mistake { background: #e67e22; color: #fff; } 
        .move-annotation.blunder { background: #df4745; color: #fff; } 
        
        .game-setup-panel { background: #34495e; padding: 14px; border-radius: 8px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
        .setup-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .start-match-btn { background: #27ae60 !important; font-weight: bold; font-size: 15px; width: 100%; transition: background 0.3s; }
        .start-match-btn:hover { background: #219653 !important; }
        
        .profile-card { background: #34495e; padding: 12px; margin: 10px 0; border-radius: 6px; border-left: 4px solid #3498db; }
        .rating-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
        .rating-box { background: #34495e; padding: 10px; border-radius: 4px; text-align: center; }
        .rating-box .value { font-size: 18px; font-weight: bold; color: #3498db; }
        .rating-box .label { font-size: 12px; color: #bdc3c7; }
        .hidden { display: none !important; }
        .clock { font-size: 28px; font-weight: bold; color: #f39c12; margin: 10px 0; font-family: monospace; }
        .side-action-btn { width: 100%; font-size: 12px; padding: 6px; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="auth-page" id="authPage">
        <div class="auth-container">
            <div class="auth-card">
                <h1>♟ Rouchess</h1>
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchAuthTab('login', event)">Login</button>
                    <button class="auth-tab" onclick="switchAuthTab('signup', event)">Sign Up</button>
                </div>
                <form id="loginForm" class="auth-form active" onsubmit="login(event)">
                    <input class="input" id="loginUsername" placeholder="Username" required>
                    <input class="input" id="loginPassword" type="password" placeholder="Password" required>
                    <button type="submit" class="submit-btn">Login</button>
                    <p id="loginMsg" class="auth-msg"></p>
                </form>
                <form id="signupForm" class="auth-form" onsubmit="signup(event)">
                    <input class="input" id="signupUsername" placeholder="Username" required>
                    <input class="input" id="signupRealname" placeholder="Full Name" required>
                    <input class="input" id="signupPassword" type="password" placeholder="Password" required>
                    <button type="submit" class="submit-btn">Create Account</button>
                    <p id="signupMsg" class="auth-msg"></p>
                </form>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="navbar">
            <h1>♟ Rouchess</h1>
            <div class="navbar-right">
                <div class="user-badge" id="userDisplay">Not logged in</div>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <div class="left-panel">
                <div class="card">
                    <h3>👤 My Profile</h3>
                    <div class="profile-card" id="myProfile"></div>
                </div>
            </div>

            <div class="main-content">
                <div class="card">
                    <h3>♟ Play Chess</h3>
                    
                    <div class="game-setup-panel">
                        <div class="setup-row">
                            <label><strong>Game Mode:</strong></label>
                            <select id="gameModeSelect" class="input" style="margin:0; width:60%; color:#fff;" onchange="toggleSetupFields()">
                                <option value="bot">Vs Computer Bot</option>
                                <option value="local">Local 2-Player (Hotseat)</option>
                                <option value="online">🌐 Online Multiplayer</option>
                            </select>
                        </div>
                        
                        <div class="setup-row" id="botDifficultyWrapper">
                            <label><strong>Bot Level:</strong> [<span id="botLevelVal">10</span>]</label>
                            <input type="range" id="botLevelSlider" min="1" max="20" value="10" style="width:60%;" oninput="document.getElementById('botLevelVal').innerText=this.value">
                        </div>
                        <div class="setup-row" id="playerColorWrapper">
                            <label><strong>Play as:</strong></label>
                            <select id="playerColorSelect" class="input" style="margin:0; width:60%; color:#fff;">
                                <option value="w">♔ White (Move First)</option>
                                <option value="b">♚ Black (Move Second)</option>
                                <option value="random">🎲 Random</option>
                            </select>
                        </div>
                        <div class="setup-row">
                            <label><strong>Time Control:</strong></label>
                            <select id="matchTimeFormat" class="input" style="margin:0; width:60%; color:#fff;">
                                <option value="blitz" selected>⚡ Blitz (5+3)</option>
                                <option value="rapid">🔥 Rapid (10+5)</option>
                            </select>
                        </div>
                        <button class="start-match-btn" id="mainPlayBtn" onclick="triggerPlayConfiguration()">▶️ Start Game</button>
                    </div>

                    <div class="game-info" id="gameStatus">Select mode and time control above</div>
                    
                    <div style="display: flex; gap: 20px; justify-content: center; align-items: center; width: 100%;">
                        <div style="text-align: center; width: 150px;">
                            <div id="whitePlayer" style="font-size: 14px; margin-bottom: 10px; font-weight: bold;">White</div>
                            <div class="clock" id="whiteClock">0:00</div>
                            <div id="whiteSideBtns" class="hidden" style="margin-top: 10px;">
                                <button onclick="resignAs('w')" class="side-action-btn" style="background: #e74c3c;">🏳️ Resign</button>
                            </div>
                        </div>

                        <div class="board-container">
                            <div id="board"></div>
                        </div>

                        <div style="text-align: center; width: 150px;">
                            <div id="blackPlayer" style="font-size: 14px; margin-bottom: 10px; font-weight: bold;">Black</div>
                            <div class="clock" id="blackClock">0:00</div>
                            <div id="blackSideBtns" class="hidden" style="margin-top: 10px;">
                                <button onclick="resignAs('b')" class="side-action-btn" style="background: #e74c3c;">🏳️ Resign</button>
                            </div>
                        </div>
                    </div>

                    <div class="moves-list" id="movesList">Game not started</div>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('chat', event)">💬 Chat</button>
                    <button class="tab-btn hidden" id="adminTabBtn" onclick="switchTab('admin', event)">⚙️ Admin</button>
                    <button class="tab-btn" onclick="switchTab('stats', event)">📊 Stats</button>
                </div>

                <div class="tab-content active" id="chat-tab">
                    <div class="chat-box">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-area">
                            <input class="input" id="chatInput" placeholder="Message..." style="margin: 0;">
                            <button onclick="sendMessage()" style="width: 50px; padding: 10px;">Send</button>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="admin-tab">
                    <div class="card">
                        <h3>⚙️ Admin Panel - Badges</h3>
                        <input class="input" id="verifyUsername" placeholder="Username to badge">
                        <select class="input" id="badgeSelect" style="color: #fff;">
                            <option value="">Select Badge</option>
                            <option value="verified">✓ Verified</option>
                            <option value="gm">♛ Grandmaster (GM)</option>
                            <option value="fm">♖ FIDE Master (FM)</option>
                            <option value="im">♗ International Master (IM)</option>
                            <option value="cm">♘ Candidate Master (CM)</option>
                        </select>
                        <button onclick="giveBadge()" style="width: 100%; margin-bottom: 8px;">Give Badge</button>
                        <button onclick="takeBadge()" style="width: 100%; background: #e67e22; margin-bottom: 8px;">Take Badge</button>
                    </div>
                    
                    <div class="card">
                        <h3>🚫 Moderation Control</h3>
                        <input class="input" id="modUsername" placeholder="Target username">
                        <button onclick="adminBanPlayer()" style="width: 100%; background: #e74c3c; margin-bottom: 8px;">Ban User</button>
                        <button onclick="adminUnbanPlayer()" style="width: 100%; background: #27ae60; margin-bottom: 8px;">Unban User</button>
                    </div>
                </div>

                <div class="tab-content" id="stats-tab">
                    <div class="card">
                        <h3>📊 Game Stats</h3>
                        <div class="rating-info" id="statsInfo"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>

    <script>
        /* =======================================
           1. FIREBASE CONFIGURATION 
           ======================================= */
        const firebaseConfig = {
            apiKey: "AIzaSyASwi2xYvco3VyzenmR6n_y3eIM-qVL6EY",
            authDomain: "rouchess.firebaseapp.com",
            databaseURL: "https://rouchess-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rouchess",
            storageBucket: "rouchess.firebasestorage.app",
            messagingSenderId: "494911482040",
            appId: "1:494911482040:web:e1a60a3338b18c5532ec4d",
            measurementId: "G-MXCKTLN848"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        /* =======================================
           2. STOCKFISH ENGINE (WITH CORS BYPASS)
           ======================================= */
        const workerData = new Blob([`importScripts("https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js");`], { type: "text/javascript" });
        let stockfish = new Worker(window.URL.createObjectURL(workerData));
        
        let lastEngineEval = 0; 
        
        stockfish.onmessage = function(event) {
            let line = event.data;
            if (line.includes("info depth 12") && line.includes("score cp")) {
                let match = line.match(/score cp (-?\d+)/);
                if (match) {
                    lastEngineEval = parseInt(match[1]); 
                    if (!isWhiteTurn) lastEngineEval = -lastEngineEval; 
                }
            } else if (line.includes("score mate")) {
                let match = line.match(/score mate (-?\d+)/);
                if(match) { lastEngineEval = parseInt(match[1]) > 0 ? 9999 : -9999; }
            }
        };

        /* =======================================
           3. BASE VARIABLES & INIT 
           ======================================= */
        let users = JSON.parse(localStorage.getItem('users')) || {
            'Rounakgod_65': { password: 'Jiko@123', realname: 'Rounak', badges: ['owner'], blitzRating: 2800, rapidRating: 2750, classicalRating: 2700, wins: 3200, losses: 1800, banned: false }
        };
        let currentUser = localStorage.getItem('currentUser');
        let game = new Chess();
        let board;
        let chatMessages = JSON.parse(localStorage.getItem('chatMessages')) || [];
        let gameActive = false;
        let whiteTime = 300, blackTime = 300, increment = 3, gameTimer;
        let isWhiteTurn = true;
        let selectedPiece = null;
        
        let gameMode = 'bot';
        let playerColor = 'w';
        let isOnlineGame = false;
        let onlineRoomId = null;
        let onlineRef = null;
        
        let moveEvaluations = [];

        function initApp() {
            if (!currentUser) {
                document.getElementById('authPage').style.display = 'flex';
                document.getElementById('appContainer').classList.remove('active');
            } else {
                document.getElementById('authPage').style.display = 'none';
                document.getElementById('appContainer').classList.add('active');
                initializeBoard('white');
                updateUI();
                displayProfile();
                displayStats();
                loadChatMessages();
                toggleSetupFields();
                stockfish.postMessage("uci");
            }
        }

        /* =======================================
           4. MATCHMAKING & UI TOGGLE
           ======================================= */
        function toggleSetupFields() {
            const mode = document.getElementById('gameModeSelect').value;
            gameMode = mode;
            
            document.getElementById('botDifficultyWrapper').style.display = mode === 'bot' ? 'flex' : 'none';
            document.getElementById('playerColorWrapper').style.display = mode === 'bot' ? 'flex' : 'none';
            
            const playBtn = document.getElementById('mainPlayBtn');
            if (mode === 'online') {
                playBtn.innerHTML = "🔍 Find Match (Play Online)";
                playBtn.style.background = "#8e44ad"; 
                playBtn.onclick = findOnlineMatch;
            } else {
                playBtn.innerHTML = "▶️ Start Game";
                playBtn.style.background = "#27ae60"; 
                playBtn.onclick = triggerPlayConfiguration;
            }
        }

        function findOnlineMatch() {
            const format = document.getElementById('matchTimeFormat').value;
            let baseTime = format === 'rapid' ? 600 : 300;
            increment = format === 'rapid' ? 5 : 3;
            whiteTime = baseTime;
            blackTime = baseTime;

            document.getElementById('gameStatus').innerText = "Looking for an opponent...";
            isOnlineGame = true;
            
            db.ref('rooms').orderByChild('status').equalTo('waiting').once('value', snapshot => {
                const rooms = snapshot.val();
                
                if (rooms) {
                    const roomId = Object.keys(rooms)[0]; 
                    if (rooms[roomId].whitePlayer === currentUser) {
                        document.getElementById('gameStatus').innerText = "You are already waiting for an opponent.";
                        return;
                    }
                    
                    onlineRoomId = roomId;
                    playerColor = 'b';
                    
                    db.ref('rooms/' + roomId).update({
                        blackPlayer: currentUser,
                        status: 'playing'
                    });
                    
                    listenToOnlineRoom();
                    startGameInternal('b');
                } else {
                    onlineRoomId = db.ref('rooms').push().key; 
                    playerColor = 'w';
                    
                    db.ref('rooms/' + onlineRoomId).set({
                        fen: game.fen(),
                        whitePlayer: currentUser,
                        blackPlayer: null,
                        status: 'waiting',
                        whiteTime: whiteTime,
                        blackTime: blackTime,
                        lastMoveTime: firebase.database.ServerValue.TIMESTAMP
                    });

                    listenToOnlineRoom();
                    startGameInternal('w');
                    document.getElementById('gameStatus').innerText = "Waiting for an opponent to join...";
                }
            });
        }

        function listenToOnlineRoom() {
            if (onlineRef) onlineRef.off();
            onlineRef = db.ref('rooms/' + onlineRoomId);
            
            onlineRef.on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;

                // Handle Resignation / opponent leaving
                if (gameActive && data.forcedWinner) {
                    endGame(data.forcedWinner, data.reason);
                }

                if (data.status === 'playing') {
                    document.getElementById('whitePlayer').textContent = `White: ${data.whitePlayer}`;
                    document.getElementById('blackPlayer').textContent = `Black: ${data.blackPlayer}`;
                    
                    if(document.getElementById('gameStatus').innerText.includes("Waiting")) {
                        updateGameStatus();
                    }
                }

                if (data.fen !== game.fen() && data.lastMoveFrom !== currentUser && !data.forcedWinner) {
                    game.load(data.fen);
                    board.position(game.fen());
                    isWhiteTurn = game.turn() === 'w';
                    whiteTime = data.whiteTime;
                    blackTime = data.blackTime;
                    calculateEngineFeedback(data.lastMoveData); 
                    updateMovesList();
                    
                    if(game.in_check()) showGameAlert('💥 CHECK!', 'check');
                    if(game.game_over()) endGame();
                    else updateGameStatus();
                }
            });
        }

        /* =======================================
           5. GAME MECHANICS, MOVES & DOTS
           ======================================= */
        function triggerPlayConfiguration() {
            isOnlineGame = false;
            playerColor = document.getElementById('playerColorSelect').value === 'random' ? (Math.random()>0.5?'w':'b') : document.getElementById('playerColorSelect').value;
            if(gameMode === 'local') playerColor = 'w';
            
            const format = document.getElementById('matchTimeFormat').value;
            let baseTime = format === 'rapid' ? 600 : 300;
            increment = format === 'rapid' ? 5 : 3;
            whiteTime = baseTime;
            blackTime = baseTime;

            startGameInternal(playerColor);
        }

        function startGameInternal(orientation) {
            gameActive = true;
            game = new Chess();
            moveEvaluations = [];
            initializeBoard(orientation === 'b' ? 'black' : 'white');
            isWhiteTurn = true;
            
            document.getElementById('whiteSideBtns').classList.remove('hidden');
            document.getElementById('blackSideBtns').classList.remove('hidden');
            
            if(!isOnlineGame) {
                document.getElementById('whitePlayer').textContent = gameMode === 'local' ? 'White: Player 1' : `White: ${playerColor==='w'?currentUser:'Bot'}`;
                document.getElementById('blackPlayer').textContent = gameMode === 'local' ? 'Black: Player 2' : `Black: ${playerColor==='b'?currentUser:'Bot'}`;
                updateGameStatus();
            }
            
            startClock();
            stockfish.postMessage(`position fen ${game.fen()}`);
            stockfish.postMessage("go depth 12"); 
            
            if (gameMode === 'bot' && playerColor === 'b') setTimeout(makeBotMove, 800);
        }

        function handleBoardClick(e) {
            if (!gameActive) return;
            const squareEl = e.target.closest('[data-square]');
            if (!squareEl) return;
            const square = squareEl.getAttribute('data-square');
            
            const isPlayerTurn = gameMode === 'local' || ((isWhiteTurn && playerColor === 'w') || (!isWhiteTurn && playerColor === 'b'));
            if (!isPlayerTurn) return; 

            if (selectedPiece === null) {
                const piece = game.get(square);
                if (piece && piece.color === (isWhiteTurn ? 'w' : 'b')) {
                    selectedPiece = square;
                    highlightSquare(square, '#baca44');
                    showLegalMoves(square);
                }
            } else {
                if (square === selectedPiece) { 
                    clearHighlights(); 
                    return; 
                }
                
                const piece = game.get(square);
                if (piece && piece.color === (isWhiteTurn ? 'w' : 'b')) {
                    clearHighlights();
                    selectedPiece = square;
                    highlightSquare(square, '#baca44');
                    showLegalMoves(square);
                    return;
                }

                const move = game.move({ from: selectedPiece, to: square, promotion: 'q' });
                if (move === null) { 
                    clearHighlights(); 
                    return; 
                }
                
                clearHighlights();
                finishMoveLogic(move);
            }
        }

        function showLegalMoves(square) {
            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(move => {
                const destSquareEl = document.querySelector(`[data-square="${move.to}"]`);
                if (destSquareEl) {
                    destSquareEl.style.position = 'relative';
                    const dot = document.createElement('div');
                    dot.className = 'move-dot';
                    destSquareEl.appendChild(dot);
                }
            });
        }

        function highlightSquare(s, c) { 
            const el = document.querySelector(`[data-square="${s}"]`);
            if(el) el.style.backgroundColor = c; 
        }

        function clearHighlights() { 
            document.querySelectorAll('.move-dot').forEach(dot => dot.remove());
            if (selectedPiece) {
                const sq = document.querySelector(`[data-square="${selectedPiece}"]`);
                // Resets color to default board scheme automatically
                if(sq) sq.style.backgroundColor = '';
            }
            selectedPiece = null; 
        } 

        function makeBotMove() {
            if (!gameActive) return;
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;
            const selectedMove = moves[Math.floor(Math.random() * moves.length)];
            game.move(selectedMove);
            finishMoveLogic(selectedMove);
        }

        function finishMoveLogic(move) {
            calculateEngineFeedback(move);

            if (isWhiteTurn) whiteTime += increment; else blackTime += increment;
            isWhiteTurn = !isWhiteTurn;
            
            board.position(game.fen());
            updateMovesList();
            updateGameStatus();

            stockfish.postMessage(`position fen ${game.fen()}`);
            stockfish.postMessage("go depth 12");
            
            if (isOnlineGame) {
                db.ref('rooms/' + onlineRoomId).update({
                    fen: game.fen(),
                    whiteTime: whiteTime,
                    blackTime: blackTime,
                    lastMoveFrom: currentUser,
                    lastMoveData: move
                });
            }

            if (game.game_over()) endGame();
            else {
                if (game.in_check()) showGameAlert('💥 CHECK!', 'check');
                if (gameMode === 'bot' && isWhiteTurn !== (playerColor === 'w')) setTimeout(makeBotMove, 800);
            }
        }

        /* =======================================
           6. CHESS.COM ELO LOGIC & MOVE EVALUATION
           ======================================= */
        function calculateEngineFeedback(move) {
            if(!move) return;
            let label = "Excellent";
            let cssClass = "excellent";
            
            if (game.history().length <= 6) { moveEvaluations.push({ label: "Book", class: "book" }); return; }
            
            game.undo();
            const legalMovesBefore = game.moves().length;
            game.move(move);
            if(legalMovesBefore === 1) {
                moveEvaluations.push({ label: "Forced", class: "forced" }); return;
            }

            if (move.san.includes('#')) { moveEvaluations.push({ label: "Brilliant", class: "brilliant" }); return; }

            const pieceValues = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
            let valueCaptured = move.captured ? pieceValues[move.captured] : 0;
            let movingPieceValue = pieceValues[move.piece];

            let tempGame = new Chess(game.fen());
            tempGame.turn(tempGame.turn() === 'w' ? 'b' : 'w'); 
            let opponentMoves = tempGame.moves({ verbose: true });
            let isAttacked = opponentMoves.some(m => m.to === move.to);

            if (move.san.includes('+') && isAttacked && movingPieceValue > valueCaptured) {
                label = "Brilliant"; cssClass = "brilliant";
            } else if (isAttacked && !move.captured) {
                if (movingPieceValue >= 5) { label = "Blunder"; cssClass = "blunder"; }
                else if (movingPieceValue >= 3) { label = "Mistake"; cssClass = "mistake"; }
                else { label = "Inaccuracy"; cssClass = "inaccuracy"; }
            } else if (valueCaptured > 0) {
                if (valueCaptured > movingPieceValue) { label = "Great Move"; cssClass = "great"; }
                else { label = "Best Move"; cssClass = "best"; }
            } else {
                let r = Math.random();
                if(r > 0.7) { label = "Best Move"; cssClass = "best"; }
                else if (r > 0.4) { label = "Excellent"; cssClass = "excellent"; }
                else { label = "Good"; cssClass = "good"; }
            }

            moveEvaluations.push({ label: label, class: cssClass });
        }

        /* =======================================
           7. TIMERS & GAME STATE LOGIC
           ======================================= */
        function startClock() {
            if (gameTimer) clearInterval(gameTimer);
            updateClocks();
            gameTimer = setInterval(() => {
                if (!gameActive) return;
                
                if(isOnlineGame && document.getElementById('gameStatus').innerText.includes("Waiting")) return;

                if (isWhiteTurn) whiteTime = Math.max(0, whiteTime - 1);
                else blackTime = Math.max(0, blackTime - 1);
                
                updateClocks();
                if (whiteTime <= 0 || blackTime <= 0) endGame();
            }, 1000);
        }

        function updateClocks() {
            const f = s => `${Math.floor(s/60)}:${s%60<10?'0':''}${s%60}`;
            document.getElementById('whiteClock').textContent = f(whiteTime);
            document.getElementById('blackClock').textContent = f(blackTime);
        }
        
        function updateMovesList() {
            const history = game.history({ verbose: true });
            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                let whiteEval = moveEvaluations[i] || { label: "Book", class: "book" };
                let moveHtml = `<span class="move-item">${(i/2)+1}. ${history[i].san}<span class="move-annotation ${whiteEval.class}">${whiteEval.label}</span>`;
                if (history[i + 1]) {
                    let blackEval = moveEvaluations[i + 1] || { label: "Book", class: "book" };
                    moveHtml += ` ${history[i + 1].san}<span class="move-annotation ${blackEval.class}">${blackEval.label}</span>`;
                }
                html += moveHtml + '</span>';
            }
            const ml = document.getElementById('movesList');
            ml.innerHTML = html || 'No moves yet';
            ml.scrollTop = ml.scrollHeight;
        }

        function endGame(forcedWinner = null, reason = null) {
            if (!gameActive) return;
            gameActive = false; 
            clearInterval(gameTimer);
            
            let resultText = 'Game Over';
            let outcome = null; 
            
            if (forcedWinner) {
                outcome = forcedWinner;
                resultText = `${forcedWinner === 'white' ? 'White' : 'Black'} won by ${reason}`;
            } else if (game.in_checkmate()) {
                outcome = (game.turn() === 'w') ? 'black' : 'white';
                resultText = `${outcome === 'white' ? 'White' : 'Black'} won by Checkmate`;
            } else if (game.in_stalemate() || game.in_draw() || game.in_threefold_repetition()) {
                outcome = 'draw';
                resultText = 'Draw';
            } else if (whiteTime <= 0) {
                outcome = 'black';
                resultText = 'Black won on time';
            } else if (blackTime <= 0) {
                outcome = 'white';
                resultText = 'White won on time';
            }

            let resultValue = 0.5;
            if (outcome === 'draw') resultValue = 0.5;
            else if ((outcome === 'white' && playerColor === 'w') || (outcome === 'black' && playerColor === 'b')) resultValue = 1;
            else resultValue = 0;
            
            let alertText = resultText;

            // Rating System (Elo Math)
            if (gameMode !== 'local') {
                const user = users[currentUser];
                const format = document.getElementById('matchTimeFormat').value;
                const currentRating = format === 'rapid' ? user.rapidRating : user.blitzRating;
                let oppRating = 1500;
                
                if (gameMode === 'bot') {
                    const level = parseInt(document.getElementById('botLevelSlider').value);
                    oppRating = 400 + ((level - 1) * 100);
                } else if (gameMode === 'online') {
                    const oppName = playerColor === 'w' ? document.getElementById('blackPlayer').textContent.replace('Black: ', '') : document.getElementById('whitePlayer').textContent.replace('White: ', '');
                    if (users[oppName]) {
                        oppRating = format === 'rapid' ? users[oppName].rapidRating : users[oppName].blitzRating;
                    }
                }

                // Chess.com Elo standard formula
                const expectedScore = 1 / (1 + Math.pow(10, (oppRating - currentRating) / 400));
                let kFactor = currentRating < 2100 ? 32 : (currentRating < 2400 ? 24 : 16);
                let ratingChange = Math.round(kFactor * (resultValue - expectedScore));
                
                if (format === 'rapid') user.rapidRating += ratingChange;
                else user.blitzRating += ratingChange;
                
                if (resultValue === 1) user.wins++;
                else if (resultValue === 0) user.losses++;
                
                localStorage.setItem('users', JSON.stringify(users));
                displayProfile();
                displayStats();

                let color = ratingChange >= 0 ? '#27ae60' : '#e74c3c';
                let sign = ratingChange >= 0 ? '+' : '';
                resultText += `<br><span style="font-size: 16px; color: ${color}; display: block; margin-top: 8px;">📊 Rating: ${currentRating} ${sign}${ratingChange} ➝ ${currentRating + ratingChange}</span>`;
            }
            
            document.getElementById('gameStatus').innerHTML = `<strong>${resultText}</strong>`;
            showGameAlert(alertText, 'draw');
            
            if (isOnlineGame && onlineRef && !forcedWinner) {
                db.ref('rooms/' + onlineRoomId).update({ status: 'finished' });
            }
        }
        
        function updateGameStatus() { 
            if(isOnlineGame && !document.getElementById('blackPlayer').textContent.includes('Black: ')) return;
            document.getElementById('gameStatus').textContent = gameActive ? `Active • ${isWhiteTurn ? "White" : "Black"}'s turn` : 'Game Finished'; 
        }
        
        function showGameAlert(text, type) {
            const oldAlert = document.getElementById('gameAlert');
            if (oldAlert) oldAlert.remove();

            const alertEl = document.createElement('div');
            alertEl.id = 'gameAlert';
            alertEl.className = 'game-alert-overlay animate-pop';
            alertEl.innerText = text;

            if (type === 'check' || type === 'checkmate') {
                alertEl.style.borderColor = '#e74c3c';
                alertEl.style.color = '#e74c3c';
                if (type === 'check') setTimeout(() => alertEl.remove(), 1200);
            } else {
                alertEl.style.borderColor = '#f39c12';
                alertEl.style.color = '#f39c12';
                setTimeout(() => alertEl.remove(), 2000);
            }
            document.querySelector('.board-container').appendChild(alertEl);
        }

        function resignAs(side) { 
            if(!gameActive) return;
            if(confirm("Are you sure you want to resign?")) {
                endGame(side === 'w' ? 'black' : 'white', 'Resignation');
                if (isOnlineGame) {
                    db.ref('rooms/' + onlineRoomId).update({ 
                        forcedWinner: side === 'w' ? 'black' : 'white', 
                        reason: 'Resignation' 
                    });
                }
            }
        }
        
        /* =======================================
           8. UI, AUTH & ADMIN FUNCTIONS
           ======================================= */
        function switchAuthTab(t, e) { 
            document.querySelectorAll('.auth-form, .auth-tab').forEach(el => el.classList.remove('active')); 
            document.getElementById(t+'Form').classList.add('active'); 
            if(e) e.target.classList.add('active'); 
        }
        
        function switchTab(t, e) { 
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active')); 
            document.getElementById(t+'-tab').classList.add('active'); 
            if(e) e.target.classList.add('active'); 
        }
        
        function login(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const msg = document.getElementById('loginMsg');
            
            if (users[username] && users[username].password === password) {
                if (users[username].banned) {
                    msg.textContent = '✗ Your account has been banned';
                    msg.classList.add('error');
                    return;
                }
                currentUser = username;
                localStorage.setItem('currentUser', currentUser);
                msg.textContent = '✓ Login successful!';
                msg.classList.remove('error');
                msg.classList.add('success');
                setTimeout(() => initApp(), 500);
            } else {
                msg.textContent = '✗ Invalid credentials';
                msg.classList.remove('success');
                msg.classList.add('error');
            }
        }

        function signup(e) {
            e.preventDefault();
            const username = document.getElementById('signupUsername').value;
            const realname = document.getElementById('signupRealname').value;
            const password = document.getElementById('signupPassword').value;
            const msg = document.getElementById('signupMsg');
            
            if (users[username]) {
                msg.textContent = '✗ Username taken';
                msg.classList.add('error');
                return;
            }
            
            users[username] = {
                password: password,
                realname: realname,
                badges: [],
                blitzRating: 1500,
                rapidRating: 1500,
                classicalRating: 1500,
                wins: 0,
                losses: 0,
                banned: false
            };
            
            localStorage.setItem('users', JSON.stringify(users));
            msg.textContent = '✓ Account created! Login now.';
            msg.classList.remove('error');
            msg.classList.add('success');
            setTimeout(() => switchAuthTab('login'), 800);
        }

        function logout() { currentUser = null; localStorage.removeItem('currentUser'); initApp(); }
        
        function updateUI() { 
            const user = users[currentUser];
            if(!user) return;
            let badgeHtml = '';
            user.badges.forEach(b => { badgeHtml += ` <span class="badge ${b}">${b.toUpperCase()}</span>`; });
            document.getElementById('userDisplay').innerHTML = `${currentUser}${badgeHtml}`;
            if (user.badges.includes('owner')) document.getElementById('adminTabBtn').classList.remove('hidden');
        }

        function displayProfile() { 
            const user = users[currentUser];
            if(!user) return;
            let html = `<strong>${user.realname}</strong><br>Username: ${currentUser}<br>Rating: ${user.blitzRating}`;
            user.badges.forEach(b => { html += ` <span class="badge ${b}">${b}</span>`; });
            document.getElementById('myProfile').innerHTML = html;
        }

        function displayStats() { 
            const user = users[currentUser];
            if(!user) return;
            const totalGames = user.wins + user.losses;
            const winRate = totalGames > 0 ? Math.round((user.wins / totalGames) * 100) : 0;
            let html = `
                <div class="rating-box"><div class="label">Blitz Rating</div><div class="value">${user.blitzRating}</div></div>
                <div class="rating-box"><div class="label">Rapid Rating</div><div class="value">${user.rapidRating}</div></div>
                <div class="rating-box"><div class="label">Total Games</div><div class="value">${totalGames}</div></div>
                <div class="rating-box"><div class="label">Win Rate</div><div class="value">${winRate}%</div></div>
            `;
            document.getElementById('statsInfo').innerHTML = html;
        }

        function sendMessage() {
            const msg = document.getElementById('chatInput').value.trim();
            if (!msg) return;
            chatMessages.push({ user: currentUser, text: msg });
            localStorage.setItem('chatMessages', JSON.stringify(chatMessages));
            document.getElementById('chatInput').value = '';
            loadChatMessages();
        }

        function loadChatMessages() {
            let html = '';
            chatMessages.slice(-30).forEach(m => {
                let uBadges = (users[m.user]?.badges || []).map(b => `<span class="badge ${b}">${b}</span>`).join('');
                html += `<div class="chat-msg"><strong>${m.user}</strong> ${uBadges}: ${m.text}</div>`;
            });
            document.getElementById('chatMessages').innerHTML = html;
        }

        function giveBadge() {
            const user = users[currentUser];
            if (!user || !user.badges.includes('owner')) return;
            const username = document.getElementById('verifyUsername').value.trim();
            const badge = document.getElementById('badgeSelect').value;
            if (!username || !badge || !users[username]) return;
            if (users[username].badges.includes(badge)) return;
            users[username].badges.push(badge);
            localStorage.setItem('users', JSON.stringify(users));
            updateUI();
        }

        function takeBadge() {
            const user = users[currentUser];
            if (!user || !user.badges.includes('owner')) return;
            const username = document.getElementById('verifyUsername').value.trim();
            const badge = document.getElementById('badgeSelect').value;
            if (!username || !badge || !users[username]) return;
            const idx = users[username].badges.indexOf(badge);
            if (idx > -1) {
                users[username].badges.splice(idx, 1);
                localStorage.setItem('users', JSON.stringify(users));
                updateUI();
            }
        }

        function adminBanPlayer() {
            const myUser = users[currentUser];
            if (!myUser || !myUser.badges.includes('owner')) return;
            const target = document.getElementById('modUsername').value.trim();
            if (users[target]) {
                users[target].banned = true;
                localStorage.setItem('users', JSON.stringify(users));
                alert(target + " has been banned.");
            }
        }

        function adminUnbanPlayer() {
            const myUser = users[currentUser];
            if (!myUser || !myUser.badges.includes('owner')) return;
            const target = document.getElementById('modUsername').value.trim();
            if (users[target]) {
                users[target].banned = false;
                localStorage.setItem('users', JSON.stringify(users));
                alert(target + " has been unbanned.");
            }
        }

        function initializeBoard(o) { 
            if(board) board.destroy(); 
            board = ChessBoard('board', { 
                position: 'start', 
                orientation: o, 
                draggable: false,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            }); 
            document.getElementById('board').removeEventListener('click', handleBoardClick);
            document.getElementById('board').addEventListener('click', handleBoardClick); 
        }
        
        initApp();
    </script>
</body>
